<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AgentBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左に業務ナビ、右に「今日やること」起点の作業面。求職者サイト側はスマホ枠＋連携ログの2カラム */
:root{
  /* ブランド：フッキャリのティール×イエロー。塗りは --brand、文字・線は読みやすい濃さの --accent */
  --brand:#0bb3ab; --brand-ink:#ffffff; --brand-deep:#08918a; --brand-weak:#e2f4f3;
  --yellow:#f7dd55; --yellow-soft:#fdf1a6; --marker:#fbef9f;
  --bg:#eef6f5; --surface:#ffffff; --sunk:#e5f1f0; --ink:#25333a; --muted:#566a6e; --line:#d2e3e1;
  --accent:#07827c; --accent-ink:#ffffff; --accent-weak:#dcf1ef;
  --ok:#2e7a3a; --ok-weak:#e1f2e3; --warn:#8f5c0d; --warn-weak:#fcf0c9; --danger:#c0431b; --danger-weak:#fbe5dc; --info:#265f9e; --info-weak:#e1ecf8;
  --line-green:#06c755; --line-deep:#04a346;
  --frame:#25333a;
  --shadow:0 1px 2px rgba(20,60,58,.06),0 6px 18px rgba(20,90,86,.07);
  --f-display:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --f-site:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#14bdb4; --brand-ink:#ffffff; --brand-deep:#0b7f79; --brand-weak:#163432;
  --yellow:#e2c845; --yellow-soft:#4a4318; --marker:#4f481c;
  --bg:#0f1716; --surface:#172221; --sunk:#121c1b; --ink:#e3eeec; --muted:#93a6a3; --line:#263634;
  --accent:#4fd2c9; --accent-ink:#04211f; --accent-weak:#173532;
  --ok:#73c27c; --ok-weak:#18301c; --warn:#e8b45a; --warn-weak:#33280f; --danger:#f08460; --danger-weak:#3a1d13; --info:#82b4ec; --info-weak:#16263a;
  --frame:#000000; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#14bdb4; --brand-ink:#ffffff; --brand-deep:#0b7f79; --brand-weak:#163432;
  --yellow:#e2c845; --yellow-soft:#4a4318; --marker:#4f481c;
  --bg:#0f1716; --surface:#172221; --sunk:#121c1b; --ink:#e3eeec; --muted:#93a6a3; --line:#263634;
  --accent:#4fd2c9; --accent-ink:#04211f; --accent-weak:#173532;
  --ok:#73c27c; --ok-weak:#18301c; --warn:#e8b45a; --warn-weak:#33280f; --danger:#f08460; --danger-weak:#3a1d13; --info:#82b4ec; --info-weak:#16263a;
  --frame:#000000; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:900;margin:0;text-wrap:balance;line-height:1.35}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);border-top:5px solid var(--yellow);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:700}
nav.menu button:hover{background:var(--sunk);color:var(--ink)}
nav.menu button.on{background:var(--accent-weak);color:var(--accent)}
nav.menu button:focus-visible{outline:2px solid var(--accent)}
nav.menu .sep{height:1px;background:var(--line);margin:8px 4px}
nav.menu button.site{border:1px dashed var(--accent);color:var(--accent);margin-top:2px}
.badge{font-family:var(--f-num);font-size:11px;background:var(--danger);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted);padding:0 8px}
.main{min-width:0;padding-inline:28px;padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:22px;margin-right:auto;letter-spacing:.04em}
.topbar h1 span.mk{background:linear-gradient(transparent 62%,var(--marker) 62%);padding:0 2px}
.poc{font-size:12px;background:var(--yellow-soft);color:var(--ink);border-radius:99px;padding:3px 12px;font-weight:700}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 2px 0 var(--brand-deep)}
.btn.pri:hover{filter:brightness(1.06);color:var(--brand-ink)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:16px;flex:none;letter-spacing:.03em;padding-left:10px;border-left:4px solid var(--brand);line-height:1.2}
.sec-h span{color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--f-num);font-size:26px;line-height:1.2}
.kpi .v small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700}
.row .d{font-size:12px;color:var(--muted)}
.clk{cursor:pointer}
.clk:hover .t{color:var(--accent);text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.c-ok{background:var(--ok-weak);color:var(--ok)}
.c-warn{background:var(--warn-weak);color:var(--warn)}
.c-danger{background:var(--danger-weak);color:var(--danger)}
.c-info{background:var(--info-weak);color:var(--info)}
.c-acc{background:var(--accent-weak);color:var(--accent)}
.when{font-family:var(--f-num);font-size:12px;min-width:74px;color:var(--muted)}
.when.late{color:var(--danger);font-weight:700}
.empty{color:var(--muted);font-size:13px;padding:14px 4px}
.funnel{display:flex;flex-direction:column;gap:8px}
.fn{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.fn .bar{height:18px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fn .bar i{display:block;height:100%;background:var(--brand);border-radius:4px;opacity:.85}
.fn .n{font-family:var(--f-num);text-align:right}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clk:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{width:100%;resize:vertical;min-height:70px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-size:13px;display:flex;justify-content:space-between;color:var(--muted);padding:2px 4px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.kc:hover{border-color:var(--accent)}
.kc .t{font-weight:700;cursor:pointer}
.kc .d{font-size:12px;color:var(--muted)}
.kc select{font-size:12px;padding:3px 6px}
.col.closed{opacity:.75}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:13px}
.dl dt{color:var(--muted);font-weight:700}
.dl dd{margin:0}
.head-card{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;flex:none}
.form{display:grid;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.form label>*{font-weight:400;color:var(--ink);font-size:14px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.score{display:flex;align-items:center;gap:8px}
.score .bar{width:90px;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--brand)}
.match{display:flex;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);flex-wrap:wrap}
.match:first-child{border-top:0}
.match .grow{flex:1;min-width:200px}
.why{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.stars{color:var(--warn);letter-spacing:1px}
.ai{border:1px dashed var(--accent);background:var(--accent-weak);border-radius:var(--r);padding:14px 16px}
.ai ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.ai li small{display:block;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:700;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--muted)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .w{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.stagebar{display:flex;gap:3px;margin-top:6px}
.stagebar i{flex:1;height:5px;border-radius:3px;background:var(--sunk)}
.stagebar i.on{background:var(--brand)}
.stagebar.x i.on{background:var(--muted)}
.csv{font-family:var(--f-num);font-size:12px;min-height:120px}
.thread{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding:4px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--sunk);align-self:flex-start;font-size:13px}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg small{display:block;font-size:11px;opacity:.75}
.src{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
/* 求職者サイト側（組み込みイメージ）：今のサイトのトーンに合わせる */
.site-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.phone{width:390px;max-width:100%;height:780px;border:10px solid var(--frame);border-radius:38px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ph-bar{background:var(--surface);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-site)}
.s-logo{display:flex;flex-direction:column;line-height:1.1;font-weight:700;font-size:20px;letter-spacing:.18em;color:var(--ink)}
.s-logo small{font-size:8px;letter-spacing:.1em;font-weight:500;color:var(--ink)}
.s-logo small em{font-style:normal;color:var(--accent)}
.s-burger{width:26px;display:flex;flex-direction:column;gap:6px}
.s-burger i{height:3px;background:var(--brand);border-radius:2px}
.s-strip{background:var(--yellow);color:#25333a;text-align:center;font-weight:900;font-size:13px;letter-spacing:.08em;padding:7px 8px;font-family:var(--f-site)}
.ph-body{flex:1;overflow:auto;font-family:var(--f-site);display:flex;flex-direction:column;background:var(--brand-weak);letter-spacing:.04em}
.ph-body>*{flex-shrink:0}
.ph-body h2,.ph-body h3{font-family:var(--f-site)}
.s-hero{background:var(--brand);padding:26px 20px 30px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.s-hero::after{content:"";position:absolute;right:-40px;top:18px;width:140px;height:22px;border-radius:99px;background:rgba(255,255,255,.18);transform:rotate(-22deg)}
.s-hero h2{font-size:30px;line-height:1.35;color:#fff;font-weight:900;font-style:italic;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.s-hero p{margin:0;font-size:13px;color:#fff}
.s-balloon{align-self:flex-start;background:var(--yellow-soft);color:var(--accent);font-weight:900;font-size:15px;border-radius:99px;padding:4px 18px;position:relative}
.s-balloon::after{content:"";position:absolute;left:50%;bottom:-7px;border:7px solid transparent;border-top-color:var(--yellow-soft);border-bottom:0;transform:translateX(-50%)}
.s-cta{background:var(--surface);margin:-14px 14px 0;border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;box-shadow:var(--shadow)}
.s-yel{background:var(--yellow-soft);border-radius:14px;padding:12px 14px;font-weight:900;font-size:14px;line-height:1.6;color:var(--ink)}
.s-free{align-self:center;background:var(--yellow);color:#25333a;font-weight:900;font-size:12px;border-radius:99px;padding:4px 16px}
.s-sec{padding:22px 16px;display:flex;flex-direction:column;gap:12px}
.s-sec h3{font-size:17px;font-weight:900;align-self:flex-start;background:linear-gradient(transparent 60%,var(--marker) 60%);padding:0 2px;color:var(--ink)}
.s-btn{all:unset;cursor:pointer;text-align:center;background:var(--brand);color:#fff;font-weight:900;border-radius:99px;padding:13px 18px;font-family:var(--f-site);letter-spacing:.06em;box-shadow:0 4px 0 var(--brand-deep);display:flex;align-items:center;justify-content:center;gap:8px}
.s-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brand-deep)}
.s-btn.line{background:var(--line-green);box-shadow:0 4px 0 var(--line-deep)}
.s-btn .lic{background:#fff;color:var(--line-green);font-size:11px;font-weight:900;border-radius:10px;padding:2px 6px;letter-spacing:0}
.s-btn.sub{background:var(--surface);color:var(--accent);box-shadow:0 3px 0 var(--brand);border:2px solid var(--brand)}
.s-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.s-job{background:var(--surface);border:2px solid var(--brand);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.s-job-h{background:var(--brand);color:#fff;font-weight:900;text-align:center;padding:7px 10px;font-size:13px;letter-spacing:.06em}
.s-job-b{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.s-job b{font-size:15px}
.s-job .d{font-size:12px;color:var(--muted)}
.s-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:11px;font-weight:700;color:var(--ink);background:var(--surface);border-radius:16px;padding:14px 8px}
.s-steps span{display:flex;flex-direction:column;align-items:center;gap:6px}
.s-steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-num);font-size:13px}
.s-panel{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.s-panel input[type=checkbox]{accent-color:var(--brand)}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.slot{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--ink);background:var(--surface)}
.slot.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.slot:focus-visible{outline:2px solid var(--accent)}
.s-card{background:var(--surface);border-radius:16px;padding:13px 15px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 var(--line)}
.s-rib{align-self:flex-start;background:var(--yellow);color:var(--accent);font-weight:900;font-size:12px;padding:2px 14px 2px 10px;margin:-13px 0 2px -15px;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%);border-top-left-radius:16px}
.s-prog{display:flex;gap:3px}
.s-prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.s-prog i.on{background:var(--brand)}
.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.ev:first-child{border-top:0}
.ev .dir{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;height:fit-content;white-space:nowrap}
.ev .in{background:var(--accent-weak);color:var(--accent)}
.ev .out{background:var(--info-weak);color:var(--info)}
.ev .line{background:var(--ok-weak);color:var(--ok)}
.ev a{color:var(--accent)}
.flash{animation:fl 1.6s ease-out}
@keyframes fl{from{background:var(--warn-weak)}to{background:transparent}}
@media (max-width:1100px){.site-wrap{grid-template-columns:1fr}.phone{margin-inline:auto}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:8px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand small,.side-foot{display:none}
  nav.menu{flex-direction:row}
  nav.menu .sep{display:none}
  nav.menu button{padding:7px 10px;white-space:nowrap}
  .main{padding-inline:16px}

function fee(p){var a=AP(p.app),j=J(a.j),co=CO(j.co);return p.salary*co.fee/100}
function log(cid,t,by){S.LOG.push({id:uid('l'),c:cid,d:day(0),t:t,by:by||S.me})}
function ev(dir,t,cid){S.EV.unshift({d:day(0),tm:now(),dir:dir,t:t,c:cid})}
function notify(c,t){ev(c.contact==='LINE'?'line':'out',c.name+'さんへ'+(c.contact==='LINE'?'LINEで通知':c.contact==='電話'?'SMSで通知':'メールで通知')+'：'+t,c.id)}
function stale(a){return a.stage!==CLOSED&&si(a.stage)<5&&diff(a.upd)<=-7}
function unread(cid){return S.MSG.filter(function(m){return m.from==='cand'&&!m.read&&(!cid||m.c===cid)}).length}

/* ===== マッチング ===== */
function score(c,j){
  var s=0,why=[];
  if(c.wantType===j.type){s+=40;why.push('職種一致')}
  if(j.area===c.area||j.area==='リモート可'){s+=20;why.push('勤務地OK')}
  if(c.salaryWant&&c.salaryWant<=j.max&&c.salaryWant>=j.min-50){s+=20;why.push('希望年収がレンジ内')}
  var hit=(c.skills||[]).filter(function(k){return j.skills.indexOf(k)>=0});
  s+=Math.min(20,hit.length*10);if(hit.length)why.push('スキル：'+hit.join('・'));
  return {s:s,why:why};
}

function go(v,p,tab){S.view=v;S.param=p||null;if(tab)S.tab=tab;save();render();window.scrollTo(0,0)}
function openC(id,tab){go('cand',id,tab||'over')}
function todos(){
  var out=[];
  S.C.forEach(function(c){if(c.next&&c.next.d&&diff(c.next.d)<=0)out.push({d:c.next.d,t:c.next.t,c:c})});
  return out.sort(function(a,b){return a.d<b.d?-1:1});
}
function menuBadge(v){
  var n=0;
  if(v==='home')n=todos().length;
  if(v==='cands')n=S.C.filter(function(c){return cstatus(c)==='新規問い合わせ'}).length+unread();
  return n?'<span class="badge">'+n+'</span>':'';
}
function render(){
  if(S.view==='cand'&&S.tab==='msg'){var ch=false;S.MSG.forEach(function(m){if(m.c===S.param&&m.from==='cand'&&!m.read){m.read=true;ch=true}});if(ch)save()}
  document.getElementById('menu').innerHTML=VIEWS.map(function(v){var on=S.view===v[0]||(S.view==='cand'&&v[0]==='cands');return '<button class="'+(on?'on':'')+'" onclick="go(\''+v[0]+'\')"><span>'+v[1]+'</span>'+menuBadge(v[0])+'</button>'}).join('')+
    '<div class="sep"></div><button class="site'+(S.view==='site'?' on':'')+'" onclick="go(\'site\')"><span>求職者サイト連携デモ</span></button>';

function kpi(l,v,u,s){return '<div class="card kpi"><span class="l">'+l+'</span><span class="v">'+v+'<small>'+u+'</small></span><span class="s">'+s+'</span></div>'}
function fstats(cs){
  var has=function(c,min){return appsOf(c.id).some(function(a){return a.hist.some(function(h){return si(h.s)>=min})||si(a.stage)>=min})};
  return {all:cs.length,met:cs.filter(function(c){return ['新規問い合わせ','面談予約済'].indexOf(cstatus(c))<0}).length,
    rec:cs.filter(function(c){return has(c,1)}).length,iv:cs.filter(function(c){return has(c,2)}).length,of:cs.filter(function(c){return has(c,4)}).length,dc:cs.filter(function(c){return has(c,5)}).length};
}
function funnel(){
  var f=fstats(S.C);
  var rows=[['相談申し込み',f.all],['面談実施',f.met],['推薦',f.rec],['面接',f.iv],['内定',f.of],['決定',f.dc]];
  return '<div class="funnel">'+rows.map(function(r){return '<div class="fn"><span>'+r[0]+'</span><span class="bar"><i style="width:'+(f.all?r[1]/f.all*100:0)+'%"></i></span><span class="n">'+r[1]+'</span></div>'}).join('')+'</div><p class="note">相談→決定率 '+(f.all?Math.round(f.dc/f.all*100):0)+'%。Instagram・LINEなど流入経路別は「帳簿・レポート」で確認できます</p>';
}

function setStage(id,s){

  if(si(s)>=1&&!(c.hearing||{}).consent){toast('第三者提供の同意が未取得のため推薦できません');render();return}
  if(si(s)>=1&&a.stage==='推薦準備'&&a.intent!=='応募したい'){toast('本人の応募意思がまだ確認できていません（マイページで「応募したい」が押されると進められます）');render();return}
  a.stage=s;a.upd=day(0);a.hist.push({s:s,d:day(0)});if(si(s)<2||s===CLOSED)a.iv=null;
  log(a.c,CO(j.co).name+'：'+s+'に更新');

  if(label)notify(c,CO(j.co).name+' '+label);
  if(si(s)>=5&&!S.PL.some(function(p){return p.app===id})){S.PL.push({app:id,salary:Math.round((j.min+j.max)/2),join:day(30),inv:'未請求'});toast('成約を登録しました。「成約・請求」で年収と入社日を確認してください')}else toast(c.name+'さん：'+s+'（本人に通知しました）');

}

function questions(c,j){

   ['数ある会社の中で、なぜ当社を選んだのですか？',co.name+'の事業・サービスに1つ具体的に触れる。「福岡で働きたい理由」もセットで'],

   '<div class="s-card"><span class="note">このページを開いたURL（デモ用に切り替え）</span><select id="sf_utm" aria-label="流入元" onchange="S.site.utm=this.value;keepForm()">'+Object.keys(SOURCES).map(function(k){return '<option value="'+k+'"'+(k===s.utm?' selected':'')+'>'+(k?'fuccari.net/?utm_source='+k:'fuccari.net/')+'</option>'}).join('')+'</select><span class="note">→ 流入経路「'+esc(SOURCES[s.utm])+'」として自動記録</span></div>'+
   '<label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:400"><input type="checkbox" id="sf_ok"> 利用規約・個人情報の取り扱いに同意する</label>'+
   '<button class="s-btn" onclick="submitSite()">この内容で申し込む</button></div></div>';
};
function keepForm(){var ids=['sf_name','sf_age','sf_tel','sf_mail','sf_type','sf_area','sf_contact','sf_memo'],v={};ids.forEach(function(i){v[i]=val(i)});var ok=document.getElementById('sf_ok').checked,y=document.getElementById('phb').scrollTop;save();render();ids.forEach(function(i){document.getElementById(i).value=v[i]});document.getElementById('sf_ok').checked=ok;document.getElementById('phb').scrollTop=y}
function submitSite(){
  var s=S.site,n=val('sf_name').trim();
  if(!n){toast('お名前を入力してください');return}
  if(!document.getElementById('sf_ok').checked){toast('利用規約・個人情報の取り扱いへの同意が必要です');return}
  var type=val('sf_type'),owner=STAFF[1+Math.floor(Math.random()*4)],contact=val('sf_contact');
  var c={id:uid('c'),name:n,kana:'',age:+val('sf_age'),phone:val('sf_tel'),email:val('sf_mail'),current:'（未ヒアリング）',wantType:type==='まだ決めていない'?JOBTYPES[0]:type,area:val('sf_area'),salaryNow:0,salaryWant:0,skills:[],owner:owner,source:s.utm,created:day(0),status:s.slot?'面談予約済':'新規問い合わせ',contact:contact,hearing:{},practice:[],docs:{resume:'',cv:''},shareQ:{},
    next:s.slot?{t:'面談前に'+contact+'で挨拶・持ち物の案内',d:day(0)}:{t:'初回連絡（面談日程の調整）',d:day(0)}};
  S.C.push(c);
  var memo=val('sf_memo');
  log(c.id,'サイトから無料相談を申し込み（'+SOURCES[s.utm]+'経由）'+(s.job?'。相談したい求人：'+J(s.job).title:'')+(memo?'。内容：'+memo:''),'サイト');
  if(s.slot){var p=s.slot.split(' ');S.MTG.push({id:uid('m'),c:c.id,d:p[0],t:p[1],owner:owner,how:'オンライン（Zoom）',kind:'初回面談'})}
  ev('in',n+'さんがサイトから無料相談を申し込み（'+SOURCES[s.utm]+'経由）→ 求職者に自動登録・担当 '+owner+(s.slot?'・面談 '+fd(s.slot.split(' ')[0])+' '+s.slot.split(' ')[1]+' を確定':''),c.id);
  notify(c,'お申し込みありがとうございます。'+(s.slot?'面談日時のご確認':'担当より日程のご連絡をします'));
  S.site.slot=null;S.site.job=null;S.site.my=c.id;S.site.sv='done';S.site.flash=true;save();render();
}
SV.done=function(){var c=C(S.site.my);return '<div class="s-sec" style="text-align:center;gap:14px;padding-top:40px"><h3>お申し込みを受け付けました</h3><p class="note" style="margin:0">'+esc(c?c.name:'')+'さん、ありがとうございます。担当アドバイザーから'+esc(c?c.contact:'')+'でご連絡します。</p><button class="s-btn" onclick="sv(\'my\')">マイページを見る</button><button class="s-btn sub" onclick="openC(\''+(c?c.id:'')+'\')">（社内側）管理画面で確認する</button></div>'};
SV.my=function(){
  var c=C(S.site.my);if(!c)return '<div class="empty">求職者を選んでください</div>';
  var ap=appsOf(c.id),mt=S.MTG.filter(function(m){return m.c===c.id&&diff(m.d)>=0})[0];
  var nexts=[];if(mt)nexts.push([mt.d,mt.t,mt.kind+'（'+mt.how+'）']);ap.forEach(function(a){if(a.iv&&diff(a.iv.d)>=0&&a.stage!==CLOSED)nexts.push([a.iv.d,a.iv.t,CO(J(a.j).co).name+' '+a.iv.k])});nexts.sort();
  var newJobs=ap.filter(function(a){return a.stage==='推薦準備'&&a.intent==='未確認'});
  var cur=ap.filter(function(a){return !(a.stage==='推薦準備'&&a.intent==='未確認')&&a.intent!=='見送り希望'});
  var ms=S.MSG.filter(function(m){return m.c===c.id}).slice(-4);
  var pr=(c.practice||[]).filter(function(p){return p.shared});
  var qj=Object.keys(c.shareQ||{});
  var h='<div class="s-hero" style="padding:18px"><h2 style="font-size:21px;font-style:normal">こんにちは、'+esc(c.name.split(' ').pop()||c.name)+'さん</h2><p>担当アドバイザー：'+esc(c.owner)+'</p></div>';
  h+='<div class="s-sec"><h3>次の予定</h3>'+(nexts.length?nexts.map(function(n){return '<div class="s-card"><b>'+fd(n[0])+' '+esc(n[1])+'</b><span class="note">'+esc(n[2])+'</span></div>'}).join(''):'<div class="s-card"><span class="note">予定はまだありません</span>'+(cstatus(c)==='新規問い合わせ'?'<button class="s-btn sub" onclick="bookMy(\''+c.id+'\')">面談日時を予約する</button>':'')+'</div>')+'</div>';
  if(newJobs.length)h+='<div class="s-sec"><h3>アドバイザーからの求人紹介 <span class="badge">'+newJobs.length+'</span></h3>'+newJobs.map(function(a){var j=J(a.j);return '<div class="s-job"><div class="s-job-h">'+esc(j.hl||'アドバイザーのおすすめ')+'</div><div class="s-job-b"><b>'+esc(j.title)+'</b><span class="d">'+esc(CO(j.co).ind)+'の企業 ・ '+esc(j.area)+' ・ 年収'+j.min+'〜'+j.max+'万円</span><div style="display:flex;gap:8px;margin-top:8px"><button class="s-btn" style="flex:1;padding:8px" onclick="answer(\''+a.id+'\',\'応募したい\')">応募したい</button><button class="s-btn sub" style="flex:1;padding:8px" onclick="answer(\''+a.id+'\',\'見送り希望\')">今回は見送る</button></div></div></div>'}).join('')+'</div>';
  h+='<div class="s-sec"><h3>選考の状況</h3>'+(cur.length?cur.map(function(a){var j=J(a.j),x=a.stage===CLOSED,i=si(a.stage);return '<div class="s-card"><b>'+esc(CO(j.co).name)+'</b><span class="note">'+esc(j.title)+'</span><div class="s-prog">'+STAGES.slice(0,6).map(function(s,k){return '<i class="'+(!x&&k<=i?'on':'')+'"></i>'}).join('')+'</div><span style="font-weight:700;font-size:13px">'+esc(CSTEP[a.stage])+(a.stage==='推薦準備'?'（アドバイザーが推薦文を準備しています）':'')+'</span></div>'}).join(''):'<div class="s-card"><span class="note">まだ応募中の求人はありません</span></div>')+'</div>';
  if(pr.length||qj.length)h+='<div class="s-sec"><h3>面接対策</h3>'+pr.map(function(p){var j=J(p.job);return '<div class="s-card"><span class="s-rib">面接練習</span><b>'+(j?esc(CO(j.co).name)+' の練習':'面接練習')+'（'+fd(p.d)+'）</b><span class="note">よかった点：'+esc(p.good)+'</span><span style="font-size:13px">次までの宿題：'+esc(p.bad)+'</span></div>'}).join('')+qj.map(function(jid){var j=J(jid);return '<div class="s-card"><span class="s-rib">想定質問</span><b>'+esc(CO(j.co).name)+'</b>'+questions(c,j).slice(0,4).map(function(q){return '<span style="font-size:13px">・'+esc(q[0])+'</span>'}).join('')+'</div>'}).join('')+'</div>';
  h+='<div class="s-sec"><h3>提出書類</h3>'+[['resume','履歴書'],['cv','職務経歴書']].map(function(d){var v=c.docs[d[0]];return '<div class="s-card" style="flex-direction:row;align-items:center;justify-content:space-between"><span><b>'+d[1]+'</b><br><span class="note">'+(v?esc(v)+'（提出済）':'未提出')+'</span></span><label class="s-btn sub" style="padding:6px 12px;font-size:12px" for="up_'+d[0]+'">'+(v?'差し替え':'アップロード')+'</label><input type="file" id="up_'+d[0]+'" hidden onchange="upDoc(\''+c.id+'\',\''+d[0]+'\',this)"></div>'}).join('')+'<span class="note">書き方がわからなくても大丈夫。アドバイザーが添削します。</span></div>';
  h+='<div class="s-sec"><h3>アドバイザーとのやりとり</h3><div class="thread" style="max-height:none">'+(ms.length?ms.map(function(m){return '<div class="msg'+(m.from==='cand'?' me':'')+'">'+esc(m.t)+'<small>'+fd(m.d)+' '+m.tm+'</small></div>'}).join(''):'<span class="note">まだメッセージはありません</span>')+'</div><div style="display:flex;gap:6px"><input type="text" id="my_msg" aria-label="メッセージ" placeholder="メッセージを入力" style="flex:1"><button class="s-btn" style="padding:8px 14px" onclick="sendCand(\''+c.id+'\')">送信</button></div></div>';
  return h;
};
function answer(aid,v){var a=AP(aid),c=C(a.c),j=J(a.j);a.intent=v;a.upd=day(0);if(v==='見送り希望'){a.stage=CLOSED;a.hist.push({s:CLOSED,d:day(0)})}
  log(c.id,'マイページで「'+j.title+'」に'+(v==='応募したい'?'応募したいと回答':'今回は見送ると回答'),'本人（マイページ）');
  if(v==='応募したい')c.next={t:CO(j.co).name+'への推薦文を作成して送る',d:day(0)};
  ev('in',c.name+'さんがマイページで「'+j.title+'」に'+(v==='応募したい'?'応募したいと回答 → 担当の今日やることに「推薦文の作成」を追加':'見送りと回答 → 選考ボードで見送りに移動'),c.id);
  S.site.flash=true;save();render();toast(v==='応募したい'?'担当アドバイザーに伝えました':'承知しました。他の求人もご紹介しますね')}
function sendCand(cid){var v=val('my_msg').trim();if(!v)return;var c=C(cid);S.MSG.push({id:uid('g'),c:cid,from:'cand',d:day(0),tm:now(),t:v,read:false});ev('in',c.name+'さんがマイページからメッセージを送信 → 管理画面に未読バッジ',cid);S.site.flash=true;save();render();toast('送信しました')}
function upDoc(cid,k,el){var f=el.files&&el.files[0];if(!f)return;var c=C(cid),l=k==='resume'?'履歴書':'職務経歴書';c.docs[k]=f.name;log(cid,l+'を提出：'+f.name,'本人（マイページ）');ev('in',c.name+'さんが'+l+'を提出（'+f.name+'）',cid);S.site.flash=true;save();render();toast('提出しました（デモではファイル名のみ記録）')}
function bookMy(cid){var sl=freeSlots();modal('<h2>面談日時を予約</h2><div class="slots">'+sl.map(function(x){var p=x.split(' ');return '<button class="slot" onclick="doBook(\''+cid+'\',\''+x+'\')">'+fd(p[0])+' '+p[1]+'</button>'}).join('')+'</div><div class="acts"><button class="btn" onclick="closeM()">閉じる</button></div>')}
function doBook(cid,x){var c=C(cid),p=x.split(' ');S.MTG.push({id:uid('m'),c:cid,d:p[0],t:p[1],owner:c.owner,how:'オンライン（Zoom）',kind:'初回面談'});c.status='面談予約済';c.next={t:'面談前に'+c.contact+'で挨拶・持ち物の案内',d:day(0)};log(cid,'マイページで面談を予約：'+fd(p[0])+' '+p[1],'本人（マイページ）');ev('in',c.name+'さんが面談を予約（'+fd(p[0])+' '+p[1]+'）→ 担当 '+c.owner+' の予定に追加',cid);S.site.flash=true;save();closeM();render();toast('予約しました')}

/* 問い合わせ登録（電話など、サイト以外の受付） */
function newCand(){modal('<h2>問い合わせを登録</h2><p class="note" style="margin:0">電話・紹介などサイト以外の受付用です。サイトからの申し込みは自動で登録されます。</p><div class="form"><div class="f2"><label>氏名<input type="text" id="n_name" placeholder="例：福岡 太郎"></label><label>ふりがな<input type="text" id="n_kana"></label><label>年齢<input type="number" id="n_age" value="25"></label></div><div class="f2"><label>電話<input type="tel" id="n_tel"></label><label>メール<input type="email" id="n_mail"></label></div><div class="f2"><label>希望職種<select id="n_type">'+JOBTYPES.map(function(t){return '<option>'+t+'</option>'}).join('')+'</select></label><label>流入経路<select id="n_src"><option value="">直接・その他</option><option value="ig">Instagram</option><option value="line">LINE</option><option value="tiktok">TikTok</option><option value="google">Google検索</option></select></label><label>担当<select id="n_own">'+STAFF.map(function(s){return '<option'+(s===S.me?' selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select></label></div><label>問い合わせ内容<textarea id="n_memo" placeholder="例：営業職への転職を考えています"></textarea></label></div><div class="acts"><button class="btn" onclick="closeM()">キャンセル</button><button class="btn pri" onclick="saveCand()">登録して初回連絡をタスク化</button></div>')}
function saveCand(){var n=val('n_name').trim();if(!n){toast('氏名を入力してください');return}var c={id:uid('c'),name:n,kana:val('n_kana'),age:+val('n_age'),phone:val('n_tel'),email:val('n_mail'),current:'（未ヒアリング）',wantType:val('n_type'),area:'天神・博多',salaryNow:0,salaryWant:0,skills:[],owner:val('n_own'),source:val('n_src'),created:day(0),status:'新規問い合わせ',contact:'電話',next:{t:'初回連絡（電話）',d:day(0)},hearing:{},practice:[],docs:{resume:'',cv:''},shareQ:{}};S.C.push(c);log(c.id,'問い合わせ受付'+(val('n_memo')?'：'+val('n_memo'):''));save();closeM();openC(c.id);toast('登録しました。今日やることに「初回連絡」を追加しました')}

/* 共通UI */
function val(id){var e=document.getElementById(id);return e?e.value:''}
function modal(html){document.getElementById('layer').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeM()"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';var f=document.querySelector('.modal input,.modal select,.modal button');if(f)f.focus()}
function closeM(){document.getElementById('layer').innerHTML=''}
var tt;function toast(m){clearTimeout(tt);var el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;tt=setTimeout(function(){el.remove()},2800)}
function askReset(){modal('<h2>デモデータに戻しますか？</h2><p style="margin:0">このブラウザで入力した内容はすべて消え、最初のサンプル状態に戻ります。</p><div class="acts"><button class="btn" onclick="closeM()">やめる</button><button class="btn pri" onclick="doReset()">戻す</button></div>')}
function doReset(){S=seed();save();closeM();render();toast('デモデータに戻しました')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
render();
</script>
